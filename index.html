<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Proposal Page</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background:
        linear-gradient(rgba(255, 178, 210, 0.3), rgba(255, 234, 243, 0.22)),
        url("Untitled-1.png") center/cover no-repeat fixed;
      color: #fff5f7;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.75) 0, transparent 18%),
        radial-gradient(circle at 80% 25%, rgba(255, 194, 214, 0.7) 0, transparent 20%),
        radial-gradient(circle at 50% 80%, rgba(253, 211, 225, 0.8) 0, transparent 22%);
      pointer-events: none;
    }

    .heart-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
    }

    .heart-bg span {
      position: absolute;
      width: 36px;
      height: 36px;
      display: block;
      background-image: url("Asset 2.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      animation: floatUp 9s linear infinite;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.35));
      opacity: 0.85;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) scale(0.7);
        opacity: 0;
      }
      15% { opacity: 1; }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(90vw, 620px);
      background: rgba(255, 244, 248, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-radius: 34px;
      padding: 40px 26px 28px;
      box-shadow: 0 30px 60px rgba(182, 53, 94, 0.18), 0 0 0 1px rgba(255,255,255,0.15) inset;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      pointer-events: none;
    }

    .emoji {
      position: relative;
      z-index: 1;
      width: 72px;
      height: 72px;
      margin: 0 auto 8px;
      background-image: url("Asset 2.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      animation: pulse 1.8s infinite;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6));
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.05) rotate(-4deg); }
      50% { transform: scale(1.12) rotate(4deg); }
      75% { transform: scale(1.05) rotate(-2deg); }
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 12px 0;
      font-size: clamp(2rem, 4vw, 3.1rem);
      color: #fc4f80;
      line-height: 1.14;
      letter-spacing: 0.02em;
      text-shadow: 0 4px 12px rgba(155, 71, 101, 0.35);
    }

    h2 {
      position: relative;
      z-index: 1;
      margin: 10px 0 24px;
      font-size: clamp(1.1rem, 2.6vw, 1.7rem);
      color: #fc4f80;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .buttons {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    button {
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      padding: 15px 30px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.1);
      letter-spacing: 0.02em;
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.28), transparent 45%, rgba(255,255,255,0.16));
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.03);
    }

    button:hover::before {
      transform: translateX(100%);
    }

    .yes {
      background: linear-gradient(135deg, #ffc2d1, #ff5d8f 40%, #d82d64);
      color: #fffdfd;
      box-shadow: 0 18px 30px rgba(216, 45, 100, 0.3);
      animation: floatButton 2.6s ease-in-out infinite;
    }

    .no {
      background: rgba(255, 255, 255, 0.9);
      color: #7b2f4d;
      position: relative;
      border: 1px solid rgba(123, 47, 77, 0.12);
      animation: floatButton 2.9s ease-in-out infinite reverse;
    }

    @keyframes floatButton {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .small-text {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      font-size: 0.87rem;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.05em;
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
        overflow: auto;
      }

      .card {
        width: min(94vw, 420px);
        padding: 28px 16px 24px;
        border-radius: 25px;
      }

      .card::before {
        inset: 8px;
        border-radius: 18px;
      }

      .emoji {
        width: 58px;
        height: 58px;
      }

      h1 {
        font-size: clamp(1.8rem, 7vw, 2.6rem);
      }

      h2 {
        font-size: clamp(1rem, 4.8vw, 1.4rem);
      }

      h3 {
        font-size: 0.82rem;
      }

      .buttons {
        flex-direction: column;
        gap: 12px;
      }

      button {
        width: 100%;
        font-size: 0.95rem;
        padding: 14px 18px;
      }

      .small-text {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="heart-bg" aria-hidden="true">
    <span style="left: 8%; animation-delay: 0s;"></span>
    <span style="left: 18%; animation-delay: 1.4s;"></span>
    <span style="left: 32%; animation-delay: 2.6s;"></span>
    <span style="left: 48%; animation-delay: 0.8s;"></span>
    <span style="left: 60%; animation-delay: 2.1s;"></span>
    <span style="left: 76%; animation-delay: 1.1s;"></span>
    <span style="left: 88%; animation-delay: 3.2s;"></span>
  </div>

  <div class="card">
    <div class="emoji" aria-label="heart icon"></div>
    <h1>แพต~~ มาเป็นแฟนกันนะ ❤️</h1>
    <h2>มีอะไรอีกเยอะเลยน้าา ที่อยากบอก</h2>
    <h3>มันอาจจะเร็วไปหน่อยนะแต่ก็อยากให้ลองดูน้าาา</h3>

    <div class="buttons">
      <button class="yes">ได้สิ~~มาเป็นแฟนกันนนน</button>
      <button class="no">ยังไม่พร้อมง่ะะ</button>
    </div>

    <div class="small-text">จากคนที่รักที่ห่างไกลลลล~~~ 💌</div>
  </div>

  <script>
    const webhookUrl = "https://discord.com/api/webhooks/1552602732425257030/gRJjw0Jbly2r3r2WVbTqMgKevzlfSkngNOHActvG2BU3W2yWNxMf6m-QGsds6sYoCMmO";

    function sendToDiscord(message) {
      fetch(webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: message })
      }).catch(() => {});
    }

    window.addEventListener("load", function () {
      sendToDiscord("💌 Someone opened the page");
    });

    document.querySelector(".yes").addEventListener("click", function () {
      sendToDiscord("✅ She clicked: ได้สิ~~มาเป็นแฟนกันนนน");
      alert("รักที่สุดเลยยยยยยยยย ❤️");
    });

    document.querySelector(".no").addEventListener("click", function () {
      sendToDiscord("❌ She clicked: ยังไม่พร้อมง่ะะ");
      this.innerText = "ยังไม่พร้อมง่าา";
      this.style.background = "#ffd9e5";
      this.style.color = "#4d1026";
      alert("แงงงบอกได้ไหมอ่าา ทำไมแต่เค้าก็ยังจะคอยเป็นห่วงเสอมนะๆ 💕");
    });
  </script>
</body>
</html>
